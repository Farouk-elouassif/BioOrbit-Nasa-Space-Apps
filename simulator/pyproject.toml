[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioorbit-simulator"
version = "0.1.0"
description = "Deterministic astronaut and cabin telemetry simulator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
space-sim = "space_sim.cli:main"

[tool.setuptools.packages.find]
include = ["space_sim*"]

[tool.setuptools.package-data]
space_sim = ["*.json"]
