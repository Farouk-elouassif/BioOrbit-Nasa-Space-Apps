services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],backend}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SIM_INGEST_TOKEN: ${SIM_INGEST_TOKEN:?Set SIM_INGEST_TOKEN in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    environment:
      SIM_STATE_PATH: /data/simulation.sqlite3
      SIM_MISSION_ID: ${SIM_MISSION_ID:-MARS_001}
      SIM_HABITAT_ID: ${SIM_HABITAT_ID:-HAB_001}
      SIM_RUN_ID: ${SIM_RUN_ID:-demo-001}
      SIM_ASTRONAUTS: ${SIM_ASTRONAUTS:-3}
      SIM_ENVIRONMENT: ${SIM_ENVIRONMENT:-transit_spacecraft}
      SIM_SURFACE_BODY: ${SIM_SURFACE_BODY:-mars}
      SIM_ERROR_LEVEL: ${SIM_ERROR_LEVEL:-0}
      SIM_SEED: ${SIM_SEED:-42}
      SIM_START: ${SIM_START:-2026-11-14T00:00:00Z}
      SIM_DURATION_DAYS: ${SIM_DURATION_DAYS:-180}
      SIM_PREFLIGHT_DAYS: ${SIM_PREFLIGHT_DAYS:-14}
      SIM_HISTORY_DAYS: ${SIM_HISTORY_DAYS:-30}
      SIM_HISTORY_INTERVAL: ${SIM_HISTORY_INTERVAL:-300}
      SIM_SPEED: ${SIM_SPEED:-1}
      SIM_EMIT_INTERVAL: ${SIM_EMIT_INTERVAL:-5}cd frontend 
      SIM_BATCH_SIZE: ${SIM_BATCH_SIZE:-500}
      SIM_HTTP_TIMEOUT: ${SIM_HTTP_TIMEOUT:-10}
      SIM_HTTP_RETRIES: ${SIM_HTTP_RETRIES:-3}
      SIM_INGEST_URL: ${SIM_INGEST_URL:-}
      SIM_INGEST_TOKEN: ${SIM_INGEST_TOKEN:-}
    volumes:
      - simulator_data:/data
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 60s
    restart: "on-failure:3"

volumes:
  postgres_data:
  simulator_data:
